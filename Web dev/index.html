<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rachit AI</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Poppins,sans-serif;
height:100vh;
background:#050510;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
}

body::before{
content:"";
position:absolute;
width:800px;
height:800px;
background:radial-gradient(circle,#00f7ff22,transparent 70%);
top:-200px;
left:-150px;
animation:move1 10s infinite alternate;
}

body::after{
content:"";
position:absolute;
width:700px;
height:700px;
background:radial-gradient(circle,#ff00ff22,transparent 70%);
bottom:-200px;
right:-150px;
animation:move2 10s infinite alternate;
}

@keyframes move1{
to{
transform:translate(120px,100px);
}
}

@keyframes move2{
to{
transform:translate(-120px,-100px);
}
}

.container{

width:90%;
max-width:900px;
height:90vh;

background:rgba(20,20,40,.55);

backdrop-filter:blur(20px);

border:1px solid rgba(255,255,255,.1);

border-radius:20px;

display:flex;
flex-direction:column;

overflow:hidden;

box-shadow:

0 0 25px cyan,

0 0 60px #ff00ff55;

z-index:10;

}

.header{

padding:20px;

text-align:center;

font-family:Orbitron;

font-size:32px;

letter-spacing:3px;

color:#00f7ff;

text-shadow:

0 0 15px cyan,

0 0 30px cyan;

border-bottom:1px solid rgba(255,255,255,.1);

}

.chat{

flex:1;

padding:20px;

overflow:auto;

}

.message{

margin-bottom:18px;

padding:14px 18px;

border-radius:15px;

max-width:80%;

white-space:pre-wrap;

line-height:1.6;

animation:fade .3s;

}

.user{

margin-left:auto;

background:#00f7ff22;

border:1px solid cyan;

color:white;

}

.bot{

background:#ff00ff22;

border:1px solid #ff00ff;

color:white;

}

@keyframes fade{

from{

opacity:0;

transform:translateY(10px);

}

to{

opacity:1;

transform:none;

}

}

.inputArea{

display:flex;

padding:20px;

gap:15px;

border-top:1px solid rgba(255,255,255,.1);

}

input{

flex:1;

padding:15px;

border:none;

outline:none;

background:#101020;

color:white;

border-radius:12px;

font-size:16px;

}

button{

padding:15px 30px;

border:none;

cursor:pointer;

font-size:16px;

font-weight:bold;

font-family:Orbitron;

border-radius:12px;

background:linear-gradient(90deg,#00f7ff,#ff00ff);

color:white;

transition:.3s;

}

button:hover{

transform:scale(1.05);

box-shadow:

0 0 20px cyan,

0 0 35px magenta;

}

::-webkit-scrollbar{

width:7px;

}

::-webkit-scrollbar-thumb{

background:cyan;

border-radius:10px;

}

</style>

</head>

<body>

<div class="container">

<div class="header">
RACHIT AI
</div>

<div class="chat" id="chat"></div>

<div class="inputArea">

<input
id="prompt"
placeholder="Ask anything..."
>

<button onclick="sendMessage()">
SEND
</button>

</div>

</div>

<script>

// =======================
// PASTE API KEY HERE
// =======================

const API_KEY="KEy here";

// =======================

const MODEL="gemini-2.5-flash";

const chat=document.getElementById("chat");

function addMessage(text,type){

const div=document.createElement("div");

div.className="message "+type;

div.innerText=text;

chat.appendChild(div);

chat.scrollTop=chat.scrollHeight;

}

async function sendMessage(){

const input=document.getElementById("prompt");

const text=input.value.trim();

if(!text)return;

addMessage(text,"user");

input.value="";

addMessage("Thinking...","bot");

const loading=chat.lastChild;

try{

const response=await fetch(

`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${API_KEY}`,

{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

contents:[

{

parts:[

{

text:text

}

]

}

]

})

}

);

const data=await response.json();

loading.remove();

if(data.candidates){

addMessage(

data.candidates[0].content.parts[0].text,

"bot"

);

}else{

addMessage(

JSON.stringify(data,null,2),

"bot"

);

}

}catch(e){

loading.remove();

addMessage(

"Error: "+e.message,

"bot"

);

}

}

document.getElementById("prompt").addEventListener("keydown",e=>{

if(e.key==="Enter")sendMessage();

});

</script>

</body>
</html>
