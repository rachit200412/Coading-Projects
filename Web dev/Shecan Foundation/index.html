<!DOCTYPE html>
<html>
<head>
    <title>She Can Foundation - Contact Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            text-align: center;
            padding-top: 40px;
        }

        h2 {
            color: #333;
        }

        form {
            background: white;
            width: 300px;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        input, textarea {
            width: 90%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px;
            width: 100%;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        #result {
            margin-top: 15px;
            font-weight: bold;
            color: green;
        }
    </style>
</head>

<body>

    <h2>She Can Foundation Form</h2>

    <form onsubmit="return submitForm()">

        <input type="text" id="name" placeholder="Enter your name"><br>

        <input type="email" id="email" placeholder="Enter your email"><br>

        <textarea id="message" placeholder="Write your message"></textarea><br>

        <button type="submit">Submit</button>

    </form>

    <p id="result"></p>

    <script>
        function submitForm() {
            document.getElementById("result").innerText = "Form Submitted Successfully";
            return false;
        }
    </script>

</body>
</html>
